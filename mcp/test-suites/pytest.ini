[pytest]
# Pytest configuration for DOST agents - uniform across MCP, Generic, Custom

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for service connections
    ragas: AI agent evaluation tests using Ragas framework
    e2e: End-to-end workflow tests
    performance: Performance and load tests
    security: Security and robustness tests
    contract: Contract and schema validation tests
    slow: Tests that take significant time to run
    requires_api: Tests that require external API access

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
addopts = 
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    -p no:warnings

# Test paths
testpaths = .

# Timeout for tests (seconds)
timeout = 60
timeout_method = thread
